name: neoscan_business
description: "POS + Inventario — NeoSTP Business app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 3.3.1

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.4

  # Models (freezed / json_serializable)
  freezed_annotation: 3.1.0
  json_annotation: ^4.9.0

  # Barcode scanning
  mobile_scanner: ^7.0.1

  # Camera (for OCR invoice photos)
  camera: ^0.11.1

  # Offline / connectivity
  connectivity_plus: ^6.1.4

  # Local DB for offline queue
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.29

  # Image picking (for OCR from gallery)
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: 2.15.0
  freezed: 3.2.5
  json_serializable: 6.14.0
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true
